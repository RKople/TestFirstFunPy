name: Build Shabbat TV APK

on:
  push:
    branches: ["shabbat-tv-build"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shabbat-tv-build
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
        working-directory: ShabbatTV
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShabbatTV-v1
          path: ShabbatTV/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish exact APK in repo
        run: |
          cp ShabbatTV/app/build/outputs/apk/debug/app-debug.apk a.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish exact APK [skip ci]"
            git pull --rebase origin shabbat-tv-build
            git push origin HEAD:shabbat-tv-build
          fi
