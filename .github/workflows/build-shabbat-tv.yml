name: Build Shabbat TV APK

on:
  push:
    branches: ["shabbat-tv-build"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
        working-directory: ShabbatTV
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShabbatTV-v0.1
          path: ShabbatTV/app/build/outputs/apk/debug/app-debug.apk
